name: New idea
description: Suggest any idea for improving Seraphine
title: "[Enhancement] (remove the parentheses and briefly describe the feature here)"
labels: ["enhancement"]

body:
  - type: textarea
    id: description
    attributes:
      label: Feature description
      description: Briefly describe your idea; images help explain it.
      placeholder: e.g. I would like a xxx feature on the xxx page, which would let users......
    validations:
      required: true
  - type: checkboxes
    id: confirm-unduplicate
    attributes:
      label: Before submitting, please confirm
      options:
        - label: I have searched previous [issues](https://github.com/Ezeki3lRchy/Seraphine/issues?q=is%3Aissue) (including closed ones), and none has the same idea
          required: true
    validations:
      required: true
