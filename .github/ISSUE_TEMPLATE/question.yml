name: Question
description: Choose this any time, including when you are unsure how to use it, how to set up the environment, or whether your problem is a bug
title: "[Question] (remove the parentheses and briefly describe your question here)"
labels: ["question"]

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Briefly describe your question.
      placeholder: Write whatever you like; images and videos are welcome.
    validations:
      required: true
  - type: checkboxes
    id: confirm-unduplicate
    attributes:
      label: Before submitting, please confirm
      options:
        - label: I have read the [FAQ](https://github.com/Ezeki3lRchy/Seraphine#faq-), and it does not solve my problem
          required: true
        - label: I have searched previous [issues](https://github.com/Ezeki3lRchy/Seraphine/issues?q=is%3Aissue) (including closed ones), and they do not solve my problem
          required: true
    validations:
      required: true
