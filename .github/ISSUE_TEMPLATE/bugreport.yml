name: Bug report
description: Report a bug to help us improve
title: "[BUG] (remove the parentheses and briefly describe the problem here)"
labels: ["bug"]

body:
  - type: textarea
    id: what-happened
    attributes:
      label: Description
      description: Briefly describe the error
      placeholder: What happened?
    validations:
      required: true
  - type: dropdown
    id: OS
    attributes:
      label: System
      description: Which operating system are you using?
      options:
        - macOS
        - Windows 11
        - Windows 10
        - Windows 7
        - Other (please specify in the description)
    validations:
      required: true
  - type: dropdown
    id: run-mode
    attributes:
      label: How you run it
      description: How do you run Seraphine?
      options:
        - Double-click the exe (Windows)
        - Open Seraphine.app (macOS)
        - Run the source code in a Python environment
    validations:
      required: true
  - type: input
    id: ver
    attributes:
      label: Version
      description: Which version of Seraphine are you using? (shown under "About" at the bottom of the settings page)
      placeholder: e.g. v0.9.2
    validations:
      required: true
  - type: input
    id: LCU-state
    attributes:
      label: Client state (if any)
      description: What state was the League client in when the problem occurred?
      placeholder: e.g. in queue
    validations:
      required: false
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce (if any)
      description: Can you make the problem happen again?
      placeholder: Describe what you did before the problem appeared, or any way you know to reproduce it. Images or videos help.
    validations:
      required: false
  - type: textarea
    id: log
    attributes:
      label: Log files
      description: Upload the log files to help us locate the problem
      placeholder: 'Windows: Seraphine\_internal\log\ — macOS: Seraphine.app/Contents/Frameworks/log/ (right-click the app → Show Package Contents)'
    validations:
      required: false
  - type: input
    id: server
    attributes:
      label: Server you play on (if any)
      description: Leave this empty if you prefer not to say.
      placeholder: e.g. Ionia
    validations:
      required: false
  - type: dropdown
    id: frequency
    attributes:
      label: Frequency (if any)
      description: In the situation you described, how often does the problem occur?
      options:
        - Not specifically tested
        - Every time
        - Most of the time
        - About half of the time
        - Very rarely
        - Only the first time, never since
    validations:
      required: true
  - type: checkboxes
    id: confirm-unduplicate
    attributes:
      label: Before submitting, please confirm
      options:
        - label: I have read the [FAQ](https://github.com/Ezeki3lRchy/Seraphine#faq-), and it does not solve my problem
          required: true
        - label: I have searched previous [issues](https://github.com/Ezeki3lRchy/Seraphine/issues?q=is%3Aissue) (including closed ones), and they do not solve my problem
          required: true
    validations:
      required: true
