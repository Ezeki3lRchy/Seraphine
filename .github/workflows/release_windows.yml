name: release-windows

# Automatic Windows release: when VERSION in app/common/config.py changes on
# main, build Seraphine.7z (build_windows.yml) and publish it as a GitHub
# Release of THIS repository (Ezeki3lRchy/Seraphine), which the in-app updater
# reads. Installed copies then offer "Update and Restart" on their next start.
#
# Nothing is published when the release vX.Y.Z already has a Seraphine.7z, so
# pushes that touch config.py without bumping VERSION are no-ops, and a version
# shipped by hand (release_win.ps1) is never overwritten.
#
# Decoupled release model (see release_win.ps1): one release per version tag
# holds both Seraphine.7z and Seraphine.dmg. If the release already exists
# (macOS shipped first) the .7z is uploaded onto it (--clobber); otherwise it is
# created with its tag pinned to the commit that was built (--target $GITHUB_SHA).
#
# Uses the built-in GITHUB_TOKEN (no PAT): contents: read everywhere, contents:
# write only on the publish job. Note: releases created with GITHUB_TOKEN do not
# trigger other workflows.
#
# The .7z check runs again right before publishing, since a hand release may
# attach its .7z while this run is building.
on:
  push:
    branches: [main]
    paths:
      - app/common/config.py

concurrency:
  group: release-windows
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASES_REPO: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Read VERSION and decide whether to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's/^VERSION = "([^"]+)".*/\1/p' app/common/config.py)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::could not read an X.Y.Z VERSION from app/common/config.py (got '$version')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if gh release view "v$version" --repo "$RELEASES_REPO" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx 'Seraphine.7z'; then
            echo "::notice::v$version already has Seraphine.7z in $RELEASES_REPO; nothing to release"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.publish == 'true'
    # The called workflow only needs contents: read (checkout); it inherits at
    # most what this caller grants.
    uses: ./.github/workflows/build_windows.yml
    with:
      version: ${{ needs.check.outputs.version }}

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: Seraphine-win-${{ needs.check.outputs.version }}
          path: out

      - name: Write release notes (commit subjects since the previous VERSION bump)
        run: |
          # The two newest commits that changed the VERSION line: this bump and the one before.
          prev=$(git log -G'^VERSION = ' --format=%H -n 2 -- app/common/config.py | sed -n 2p)
          {
            echo "## v$VERSION (Windows)"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --format='- %s' "$prev..HEAD" | grep -v '^- release: bump VERSION' || true
            else
              echo "Maintenance release."
            fi
            echo
            echo "Use **Update and Restart** to install."
          } > notes.md
          cat notes.md

      - name: Publish Seraphine.7z
        run: |
          # Re-check: a hand release (release_win.ps1 pushes the bump right before it
          # creates the release) may have attached its .7z while this run was building.
          if gh release view "v$VERSION" --repo "$RELEASES_REPO" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx 'Seraphine.7z'; then
            echo "::notice::v$VERSION already has Seraphine.7z in $RELEASES_REPO; not overwriting"
            exit 0
          fi
          if gh release view "v$VERSION" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release upload "v$VERSION" out/Seraphine.7z --repo "$RELEASES_REPO" --clobber
          else
            gh release create "v$VERSION" out/Seraphine.7z --repo "$RELEASES_REPO" \
              --target "$GITHUB_SHA" --title "v$VERSION (Windows)" --notes-file notes.md
          fi
          echo "::notice::published v$VERSION to $RELEASES_REPO"
