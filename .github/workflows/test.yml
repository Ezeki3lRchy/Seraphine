name: test

# Runs the unit-test suite (tests/, stdlib unittest, Qt offscreen) on Windows and
# macOS. Runs on every push to main and every pull request, and is called by
# release.yml (workflow_call) before each platform's build: the release only builds
# and publishes a platform whose own test run passed. When called with `os`, only
# that runner is used, so each platform is gated on its own result.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      os:
        description: "Run on this runner only (windows-latest or macos-latest); empty runs both"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os != '' && format('["{0}"]', inputs.os) || '["windows-latest","macos-latest"]') }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the unit tests
        run: python -m unittest discover -s tests -t .

  # ruff (pyproject.toml), once on Linux: the code is the same on every OS. Only for a
  # push / pull request run: a call from release.yml always passes `os`, so this job is
  # skipped there and a lint finding can never hold back a platform's release build.
  lint:
    if: inputs.os == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff and PyYAML
        run: pip install -r requirements-dev.txt

      - name: Run ruff
        run: ruff check .

      # A workflow file that does not parse never runs, so it cannot report its own
      # syntax error; this job (when test.yml itself is valid) checks all of them.
      - name: Check that every workflow and config YAML file parses
        run: python tools/check_yaml.py

      # The release graph (release.yml: publish needs, the gate step, every download
      # / upload condition, the noManifest flag's path), simulated over every job
      # outcome against the publish rules. Runs here, on every push and pull request
      # (the way release.yml changes reach main), not in the release run itself.
      - name: Check the release graph
        run: python tools/check_release_graph.py

      # ... and that the check fails on broken copies of release.yml (its reverse
      # cases; they need PyYAML, so they live in the tool, not in tests/).
      - name: Check that the release graph check catches broken graphs
        run: python tools/check_release_graph.py --self-test
